<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Eric Jojo Bro</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:#1a1a1a;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px gold;
}

h2{
    text-align:center;
    color:gold;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:gold;
    color:black;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffd700;
}

p{
    text-align:center;
}

a{
    color:gold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
<h2>Create Account</h2>

<form>
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<input type="password" placeholder="Confirm Password" required>

<button type="submit">Sign Up</button>
</form>

<p>Already have an account?
<a href="login.html">Login</a></p>

</div>

</body>
</html>
